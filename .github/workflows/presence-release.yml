name: Presence unlock build

# Publishes a normal (non-prerelease) GitHub Release that the in-app updater
# can see via /releases/latest. Release "name" must be a parseable version
# (e.g. v0.9.1-3-gabcdef) and assets must include StashAppAndroidTV.apk /
# StashAppAndroidTV-release.apk (plus ABI-specific copies).

on:
  push:
    branches:
      - main
      - cursor/presence-pin-unlock-def2
      - cursor/pin-datastore-sync-ba55
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=512m'"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare personal signing keystore
        env:
          PERSONAL_KEYSTORE_BASE64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
          PERSONAL_KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
          PERSONAL_KEY_ALIAS: ${{ secrets.PERSONAL_KEY_ALIAS }}
          PERSONAL_KEY_PASSWORD: ${{ secrets.PERSONAL_KEY_PASSWORD }}
        run: |
          if [[ -n "${PERSONAL_KEYSTORE_BASE64:-}" ]]; then
            echo "$PERSONAL_KEYSTORE_BASE64" | base64 -d > app/personal.keystore
            echo "Using PERSONAL_KEYSTORE from secrets"
          else
            keytool -genkeypair -v \
              -keystore app/personal.keystore \
              -alias stash-tv \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass stash-tv-local -keypass stash-tv-local \
              -dname "CN=ExtremeHobo StashAppAndroidTV, O=ExtremeHobo, C=US"
            echo "Generated ephemeral personal.keystore"
          fi
          echo "PERSONAL_KEYSTORE_PASSWORD=${PERSONAL_KEYSTORE_PASSWORD:-stash-tv-local}" >> "$GITHUB_ENV"
          echo "PERSONAL_KEY_ALIAS=${PERSONAL_KEY_ALIAS:-stash-tv}" >> "$GITHUB_ENV"
          echo "PERSONAL_KEY_PASSWORD=${PERSONAL_KEY_PASSWORD:-stash-tv-local}" >> "$GITHUB_ENV"

      - name: Version names
        run: |
          VERSION_NAME=$(git describe --tags --match 'v*' --long)
          # GitHub release tags cannot contain some chars; keep describe form.
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Release version: $VERSION_NAME"

      - name: Build release APK
        run: |
          ./gradlew clean assembleRelease --no-daemon

      - name: Copy short asset names for in-app updater
        run: |
          set -euo pipefail
          out=app/build/outputs/apk/release
          mkdir -p "$out"
          # Universal
          uni=$(find app/build/outputs/apk -name 'StashAppAndroidTV-release-*-*.apk' ! -name '*-arm64-v8a.apk' ! -name '*-armeabi-v7a.apk' | head -n1)
          arm64=$(find app/build/outputs/apk -name 'StashAppAndroidTV-release-*-arm64-v8a.apk' | head -n1)
          v7a=$(find app/build/outputs/apk -name 'StashAppAndroidTV-release-*-armeabi-v7a.apk' | head -n1)
          echo "uni=$uni"
          echo "arm64=$arm64"
          echo "v7a=$v7a"
          cp -f "$uni" "$out/StashAppAndroidTV.apk"
          cp -f "$uni" "$out/StashAppAndroidTV-release.apk"
          cp -f "$arm64" "$out/StashAppAndroidTV-arm64-v8a.apk"
          cp -f "$arm64" "$out/StashAppAndroidTV-release-arm64-v8a.apk"
          cp -f "$v7a" "$out/StashAppAndroidTV-armeabi-v7a.apk"
          cp -f "$v7a" "$out/StashAppAndroidTV-release-armeabi-v7a.apk"
          ls -la "$out"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StashAppAndroidTV-presence-unlock
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Recreate this version tag/release if rebuilding the same commit.
          gh release delete "${{ env.VERSION_NAME }}" --cleanup-tag -y || true

          cat > ci_release_note.txt <<EOF
          ### Presence PIN unlock (\`${{ env.VERSION_NAME }}\`)

          Fork of StashAppAndroidTV with Home Assistant presence PIN unlock
          (Sam home + Meghan away + Guest Mode off).

          In-app updates: Settings → Advanced → Update URL should be
          \`https://api.github.com/repos/ExtremeHobo/StashAppAndroidTV/releases/latest\`
          (this is the app default in this fork).

          <!-- app-note:Presence PIN unlock build for ExtremeHobo fork -->
          EOF

          # Only upload the short names the in-app updater looks for.
          # Do not also glob the gradle-versioned APKs — that duplicates
          # StashAppAndroidTV-release-*.apk basenames and 422s the upload.
          gh release create "${{ env.VERSION_NAME }}" \
            --latest \
            --title "${{ env.VERSION_NAME }}" \
            --target "${{ github.sha }}" \
            -F ci_release_note.txt \
            app/build/outputs/apk/release/StashAppAndroidTV.apk \
            app/build/outputs/apk/release/StashAppAndroidTV-release.apk \
            app/build/outputs/apk/release/StashAppAndroidTV-arm64-v8a.apk \
            app/build/outputs/apk/release/StashAppAndroidTV-release-arm64-v8a.apk \
            app/build/outputs/apk/release/StashAppAndroidTV-armeabi-v7a.apk \
            app/build/outputs/apk/release/StashAppAndroidTV-release-armeabi-v7a.apk
